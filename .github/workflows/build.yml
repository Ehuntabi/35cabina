name: build

# Compila el firmware en cada push/PR. Hasta el 16-sep-2026 este repo solo
# comprobaba los protocolos compartidos (mini_proto_sync y viaje_body_sync) y un
# error de COMPILACION no lo pillaba nadie hasta compilar a mano (auditoria del
# 15-sep-2026, 4.I3). No sustituye probar en la placa: solo pilla lo que no
# compila.
#
# OJO con wifi_credentials.h: no esta versionado (lleva la password real del AP
# de la P4), asi que el primer intento de CI fallo con "wifi_credentials.h: No
# such file or directory". Se crea desde la plantilla versionada ANTES de
# compilar, solo para que el compilador tenga algo que ver. No hay riesgo de
# publicar un binario con la password de broma: esta accion NO sube artefactos
# (comprobado en su action.yml: solo hace docker run + idf.py build), el
# binario que se graba se compila en local con la cabecera de verdad, y el
# .example lo sigue diciendo.

on:
  push:
  pull_request:

# El GITHUB_TOKEN por defecto puede escribir en el repo y este job solo lee.
# Faltaba aqui (revision del 13-oct-2026): estaba en los otros tres workflows.
# Las acciones van FIJADAS POR SHA, no por etiqueta (auditoria de seguridad del
# 13-oct-2026): una etiqueta la puede mover quien controle el repo de la accion
# -- o quien se haga con el -- y el runner ejecutaria ese codigo con el token
# del reposo (contents: read). Con el SHA, lo que corre es exactamente lo que se
# reviso. Para actualizar: mira el SHA de la etiqueta nueva y cambialo aqui.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # sin los tags, la version embebida sale "v?"

      # Se copia la plantilla tal cual: compila igual porque son dos #define de
      # cadena. El build local SIN este fichero sigue fallando a proposito.
      - name: Crear wifi_credentials.h desde la plantilla (solo para compilar)
        run: |
          if [ -f main/wifi_credentials.h ]; then
            echo "Ya existe main/wifi_credentials.h (no deberia: no esta versionado)"
          else
            cp main/wifi_credentials.h.example main/wifi_credentials.h
            echo "[ok] creado desde la plantilla"
          fi

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: '.'

      # La auditoria mira el .bin y el sdkconfig.h que acaba de dejar el build
      # (IDF correcta, Task WDT, pilas de tarea, LVGL bajo cerrojo, enlace con la
      # P4...). Ver test/auditar.sh: cada regla existe por un fallo o una
      # invariante concreta. Los chequeos que necesitan el repo de la P4 al lado
      # se omiten solos (aqui solo se clona este).
      - name: Auditoria (reglas del proyecto)
        run: bash test/auditar.sh

      # El cambio de hora de OCTUBRE (B19, auditoria del 27-oct-2026): al atrasar
      # el reloj, el calculo de antes decia "este tramo empezo despues del cambio" y
      # no lo corregia. Se prueba la cuenta nueva (desfase con el que se abrio cada
      # tramo) en los dos cambios y la caida al calculo viejo cuando no hay dato.
      - name: El cambio de hora no deja mal los tramos abiertos
        run: bash test/reloj_cambio_hora.sh

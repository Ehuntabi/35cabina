name: mini_proto_sync

# mini_proto.h se mantiene sincronizado A MANO entre este repo y victron
# (protocolo UDP compartido, ver la cabecera del fichero). Sin esto, editar
# solo una copia no falla hasta que los dos aparatos se rechazan los
# paquetes en produccion, semanas despues. Detectado auditando el
# 07-sep-2026.
#
# (El build de ESP-IDF vive en build.yml desde el 16-sep-2026; este workflow
# solo comprueba los protocolos compartidos.)

on:
  push:
  pull_request:

# El GITHUB_TOKEN por defecto puede escribir en el repo; estos jobs solo leen.
# Con acciones PUBLICAS y sin fijar por SHA (auditoria de seguridad del
# 13-oct-2026) lo minimo es no darles permiso de escritura.
# Las acciones van FIJADAS POR SHA, no por etiqueta (auditoria de seguridad del
# 13-oct-2026): una etiqueta la puede mover quien controle el repo de la accion
# -- o quien se haga con el -- y el runner ejecutaria ese codigo con el token
# del reposo (contents: read). Con el SHA, lo que corre es exactamente lo que se
# reviso. Para actualizar: mira el SHA de la etiqueta nueva y cambialo aqui.

permissions:
  contents: read

jobs:
  mini_proto_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: 35cabina

      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/victron-jc1060p470c-esp32p4
          path: victron

      # La 5" (cabina5) tambien habla el mismo protocolo y NO estaba en este
      # job: tocar mini_proto.h alli no lo detectaba nadie (auditoria del
      # 13-oct-2026). Hoy los tres son identicos; esto es la bomba de
      # relojeria que se desactiva.
      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      - name: Comparar mini_proto.h entre los tres proyectos
        run: |
          # Mismo reintento que el paso del ciclo del viaje (carrera de push
          # entre los tres repos: se publican de uno en uno).
          for intento in 1 2 3 4; do
            if diff -q 35cabina/main/net/mini_proto.h victron/main/net/mini_proto.h >/dev/null &&
               diff -q 35cabina/main/net/mini_proto.h cabina5/main/net/mini_proto.h >/dev/null; then
              echo "mini_proto.h identico en los tres proyectos"
              exit 0
            fi
            if [ "$intento" = 4 ]; then break; fi
            echo "--- intento $intento: alguno de los vecinos puede ir por detras; se reintenta en 45 s"
            sleep 45
            for r in victron cabina5; do
              git -C "$r" fetch -q origin main && git -C "$r" reset -q --hard origin/main || true
            done
          done
          diff 35cabina/main/net/mini_proto.h victron/main/net/mini_proto.h || true
          diff 35cabina/main/net/mini_proto.h cabina5/main/net/mini_proto.h || true
          echo "mini_proto.h se ha separado entre los proyectos"
          exit 1

  # Espejo del job "viaje_body_sync" de victron (el otro repo del par): el
  # limite de cuerpo del apunte tambien se mantiene sincronizado A MANO
  # (CUERPO_MAX en este satelite tiene que caber siempre en VIAJE_BODY_MAX de
  # la P4, con margen). El guard vivia SOLO en el CI de victron -- el repo
  # que puede romper el limite (subiendo CUERPO_MAX aqui) no tenia forma de
  # detectarlo el mismo, solo se enteraba victron, y despues del push, sin
  # senalar a quien lo causo. Detectado por el usuario el 09-sep-2026 (mismo
  # motivo que mini_proto_sync).
  viaje_body_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: 35cabina

      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/victron-jc1060p470c-esp32p4
          path: victron

      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      - name: Comprobar que CUERPO_MAX (satelite) cabe en VIAJE_BODY_MAX (P4)
        run: |
          cuerpo_max=$(grep -oP '#define\s+CUERPO_MAX\s+\K[0-9]+' 35cabina/main/net/viaje_cola.h)
          cuerpo_max5=$(grep -oP '#define\s+CUERPO_MAX\s+\K[0-9]+' cabina5/main/net/viaje_cola.h)
          body_max=$(grep -oP '#define\s+VIAJE_BODY_MAX\s+\K[0-9]+' victron/main/portal/config_server_viaje.c)
          echo "CUERPO_MAX (35cabina) = $cuerpo_max"
          echo "CUERPO_MAX (cabina5)  = $cuerpo_max5"
          if [ "$cuerpo_max" != "$cuerpo_max5" ]; then
            echo "CUERPO_MAX distinto entre las dos cabinas ($cuerpo_max vs $cuerpo_max5)"
            exit 1
          fi
          echo "VIAJE_BODY_MAX (victron) = $body_max"
          if [ -z "$cuerpo_max" ] || [ -z "$body_max" ]; then
            echo "No se pudo leer alguna de las dos constantes"; exit 1
          fi
          if [ "$cuerpo_max" -ge "$body_max" ]; then
            echo "CUERPO_MAX ($cuerpo_max) ya no cabe con margen en VIAJE_BODY_MAX ($body_max) -- subir VIAJE_BODY_MAX en victron"
            exit 1
          fi

  # LOS FICHEROS DEL VIAJE, BYTE A BYTE EN LAS DOS CABINAS (auditoria del
  # 14-oct-2026). El ciclo del viaje -- la cola, la reconciliacion del arranque,
  # el contador, los cuerpos que se mandan a la P4 -- es el MISMO codigo en las
  # dos, y las dos placas escriben sobre el mismo viaje de la P4. Una edicion en
  # una sola pasaba el CI en verde (solo se comparaban mini_proto.h y
  # CUERPO_MAX) y a partir de ahi las dos cuentan, reconcilian o descartan
  # distinto sobre el mismo viaje. Aqui se cae solo.
  viaje_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 35cabina
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: 35cabina

      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/cabina5
          path: cabina5

      # Y LA P4, que hasta el 16-oct-2026 no se bajaba en este job: el test de
      # los contadores del viaje saca de udp_tx.c el trozo que los parte en
      # bytes, y sin el repo al lado no puede comprobar nada (fallaba con "no
      # encuentro el repo victron").
      - name: Checkout victron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/victron-jc1060p470c-esp32p4
          path: victron

      - name: El ciclo del viaje, identico en las dos cabinas
        run: |
          # CARRERA DE PUSH (17-oct-2026): los dos repos de las cabinas se
          # publican de uno en uno, y este job compara contra la rama del
          # vecino en el instante en que corre. Un cambio que toca el espejo
          # llega primero a un repo y unos segundos despues al otro; si el job
          # del primero corre en medio ve la version vieja del vecino y se pone
          # rojo SIN que haya deriva ninguna (paso tres veces seguidas el
          # 17-oct). Antes de darse por vencido se vuelve a traer la rama del
          # vecino y se reintenta: si la diferencia es de verdad, sigue ahi al
          # cuarto intento y el job cae igual.
          compara() {
          for f in main/net/viaje_cola.c \
                   main/net/viaje_cola.h \
                   main/net/p4_api.c \
                   main/net/p4_api.h \
                   main/net/ota_rx.c \
                   main/net/ota_rx.h \
                   main/net/apunte.c \
                   main/net/apunte.h \
                   main/net/udp_rx.c \
                   main/data_model.c \
                   main/data_model.h \
                   main/diag_reset.c \
                   main/diag_reset.h \
                   main/reloj.c \
                   main/reloj.h \
                   main/net/mini_proto.h \
                   main/salida.c \
                   main/salida.h \
                   components/config_storage/config_storage.c \
                   components/config_storage/include/config_storage.h \
                   test/viaje_cola_control_arnes.c test/viaje_cola_control.sh \
                   test/viaje_cola_libre_arnes.c test/viaje_cola_libre.sh \
                   test/viaje_horario_arnes.c test/viaje_horario.sh \
                   test/viaje_contadores.sh test/viaje_contadores_arnes.c \
                   test/ota_version.sh test/ota_version_arnes.c \
                   main/ui/ui_style.h \
                   test/estilo.sh ; do
            if [ ! -f "35cabina/$f" ] || [ ! -f "cabina5/$f" ]; then
              echo "FALTA $f en alguno de los dos repos"; return 1
            fi
            # Se comparan SIN las lineas de #include: la 5" es LVGL 9 y la 3,5"
            # LVGL 8, asi que el include de compatibilidad difiere y no es
            # deriva. El resto del fichero tiene que ser identico.
            if ! diff -q <(grep -v '^#include' "35cabina/$f") \
                         <(grep -v '^#include' "cabina5/$f") >/dev/null; then
              echo "DISTINTO: $f"
              diff -u <(grep -v '^#include' "35cabina/$f") \
                      <(grep -v '^#include' "cabina5/$f") | head -40
              return 1
            fi
          done
          return 0
          }
          for intento in 1 2 3 4; do
            if compara; then echo "ciclo del viaje identico en las dos cabinas"; exit 0; fi
            if [ "$intento" = 4 ]; then break; fi
            echo "--- intento $intento: cabina5 puede ir por detras (se publica de uno en uno); se reintenta en 45 s"
            sleep 45
            git -C cabina5 fetch -q origin main && git -C cabina5 reset -q --hard origin/main || true
          done
          echo "Las dos cabinas tienen que llevar el MISMO ciclo de viaje"
          exit 1

      # Y la clasificacion de la que depende la garantia del cierre se PRUEBA
      # (saca la funcion real de viaje_cola.c y la compila).
      - name: El cierre del viaje siempre cabe en la cola
        run: bash 35cabina/test/viaje_cola_control.sh

      # Y el parseo del hueco de la SD de la P4 (que llega en el cuerpo de la
      # respuesta HTTP que antes se tiraba).
      - name: El hueco de la tarjeta de la P4 se entiende
        run: bash 35cabina/test/viaje_cola_libre.sh

      # Y que el cambio de horario no acorte una pernocta (el epoch_local da un
      # salto atras de 3600 s: la P4 manda su desfase y la cabina corrige).
      - name: El cambio de horario no acorta las pernoctas
        run: bash 35cabina/test/viaje_horario.sh

      # Y que los contadores del viaje (km y horas de conduccion) lleguen enteros
      # de la P4 a la cabina: van partidos en cuatro bytes sueltos del struct y
      # cruzarlos no salta a la vista (un viaje de 1200 km se lee como 4920).
      - name: Los km y las horas de conduccion llegan enteros
        run: bash 35cabina/test/viaje_contadores.sh

      # Y las decisiones de la actualizacion OTA (comparacion de versiones y
      # sha256): se sacan del ota_rx.c real y se compilan en el runner. Un error
      # aqui deja la pantalla con un firmware que no arranca.
      - name: La actualizacion OTA decide bien (version y sha256)
        run: bash 35cabina/test/ota_version.sh

      # Y el estilo de la UI: que ningun nombre de fuente se quede sin alias
      # (si se queda, tira de la del SDK y el texto sale al tamaño literal, que
      # es el fallo que se colo el 16-oct-2026), que no haya colores a mano y
      # que los titulos vayan centrados.
      - name: El estilo de la UI (fuentes, paleta, titulos)
        run: bash 35cabina/test/estilo.sh

      # ── GUARDAS DE LOS SCRIPTS DE PUBLICAR Y GRABAR (16-oct-2026) ──────────
      # El CI no graba ni publica (no hay placas ni secretos) y eso NO cambia: el
      # .bin de la Release lo compila release.sh EN LOCAL, con la cabecera REAL
      # del AP, mientras que este workflow compila con la PLANTILLA ("CAMBIAME").
      # O sea que "lo compila el CI, luego esta bien" es falso justo para el .bin
      # que se descarga. Lo que SI puede hacer el CI es vigilar que los scripts
      # que graban y publican conserven sus comprobaciones: la auditoria del
      # 16-oct encontro a la 3,5" sin el guard de wifi_credentials.h y a las dos
      # con la comprobacion del .bin metida en el "else" de "la Release ya
      # existe" (una Release sin asset acababa en "PUBLICADO" y exit 0). Que se
      # caiga aqui es barato; que se caiga con la placa delante, no.
      - name: El CI no publica, y release.sh no publica la clave de broma
        run: |
          for repo in cabina5 35cabina; do
            if git -C "$repo" ls-files --error-unmatch main/wifi_credentials.h >/dev/null 2>&1; then
              echo "$repo: main/wifi_credentials.h esta VERSIONADO (lleva la clave real del AP)"; exit 1
            fi
            grep -q 'wifi_credentials.h' "$repo/release.sh" \
              || { echo "$repo: release.sh no comprueba la clave del AP"; exit 1; }
          done
          echo "el CI no publica binarios; release.sh exige la clave real antes de publicar"

      - name: Los guardas de grabar/publicar siguen en su sitio (las dos cabinas)
        run: |
          fallo=0
          for repo in cabina5 35cabina; do
            g="$repo/scripts/grabar.sh"; r="$repo/release.sh"
            for f in "$g" "$r"; do [ -f "$f" ] || { echo "FALTA $f"; fallo=1; }; done
            for frase in 'git describe --tags --exact-match' 'git ls-remote origin' \
                         'gh release download' 'sha256sum' 'chip_id' 'write_flash' \
                         'xtensa-esp32s3-elf-gcc' 'components' 'partitions.csv' \
                         'git checkout -- sdkconfig'; do
              grep -qF -- "$frase" "$g" || { echo "$g: le falta '$frase'"; fallo=1; }
            done
            for frase in 'wifi_credentials.h' 'sha256sum' 'gh release upload' \
                         'grep -qxF "$ASSET"' 'git checkout -- sdkconfig'; do
              grep -qF -- "$frase" "$r" || { echo "$r: le falta '$frase'"; fallo=1; }
            done
            if grep -qE '^[[:space:]]*idf\.py +-p.*flash' "$g" "$r"; then
              echo "$repo: ha vuelto 'idf.py flash' a los scripts (es el camino sin comprobaciones)"; fallo=1
            fi
          done
          [ "$fallo" = 0 ] || { echo "Se han perdido guardas en los scripts de grabar/publicar"; exit 1; }
          echo "guardas presentes en las dos cabinas"

      - name: El esquema de alias de fuentes (alias -> fuente DEL PROYECTO)
        run: |
          # Los nombres viejos del SDK tienen que apuntar a una fuente del
          # proyecto (lv_font_inter_*_es) o a un papel (FUENTE_*), nunca a otra
          # del SDK ni a un nombre inventado: si apuntan mal, el texto sale con
          # la fuente del SDK (tamaño literal) y no falla al compilar.
          fallo=0
          for repo in cabina5 35cabina; do
            malos=$(grep -rhE '^#define +lv_font_montserrat_(bold_)?[0-9]+ +' "$repo/main" --include=*.h \
                    | awk '{print $3}' | grep -vE '^(lv_font_inter_[a-z0-9_]*|FUENTE_[A-Z_]+)$' || true)
            [ -z "$malos" ] || { echo "$repo: alias que NO apuntan a una fuente del proyecto: $malos"; fallo=1; }
          done
          [ "$fallo" = 0 ] || exit 1
          echo "los alias de las dos cabinas apuntan a fuentes del proyecto"

      - name: La captura de panicos esta versionada (nada de /tmp/cap2.py)
        run: |
          for repo in cabina5 35cabina; do
            test -f "$repo/scripts/cap2.py" || { echo "$repo: falta scripts/cap2.py"; exit 1; }
            grep -q 'AQUI/cap2.py' "$repo/scripts/vigilar_panicos.sh" \
              || { echo "$repo: vigilar_panicos.sh no usa scripts/cap2.py"; exit 1; }
            if grep -q '/tmp/cap2.py' "$repo/scripts/vigilar_panicos.sh"; then
              echo "$repo: vigilar_panicos.sh sigue llamando a /tmp/cap2.py"; exit 1
            fi
          done
          echo "la captura del serial esta en el repo"

      - name: shellcheck de los scripts propios
        run: |
          shellcheck -S warning \
            cabina5/scripts/grabar.sh cabina5/scripts/vigilar_panicos.sh cabina5/release.sh \
            cabina5/test/estilo.sh \
            35cabina/scripts/grabar.sh 35cabina/scripts/vigilar_panicos.sh 35cabina/release.sh \
            35cabina/test/estilo.sh 35cabina/test/auditar.sh
